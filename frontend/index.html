<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,650;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>Dvarf</title>
    <!-- Instant theme from local cache before JS modules load (survives hard refresh / deploy). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('dvarf.accountAppearance.v1')
          if (!raw) return
          var a = JSON.parse(raw)
          if (a && typeof a.themeId === 'string') {
            document.documentElement.setAttribute('data-theme', a.themeId)
          }
          if (a && typeof a.abilityColors === 'string') {
            document.documentElement.setAttribute('data-ability-colors', a.abilityColors)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

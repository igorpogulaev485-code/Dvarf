<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Dvarf</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0f1419; color: #e8eef5; font-family: system-ui, sans-serif; }
      #boot {
        min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      }
      #boot[hidden] { display: none; }
      #boot p { margin: 0; opacity: 0.75; font-size: 15px; }
      #boot .err { margin-top: 12px; color: #ffb4b4; font-size: 13px; max-width: 28rem; }
    </style>
  </head>
  <body>
    <div id="boot"><p>Загрузка Dvarf…</p></div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        var boot = document.getElementById('boot')
        if (!boot || boot.hidden) return
        var err = document.createElement('p')
        err.className = 'err'
        err.textContent = 'Не удалось загрузить приложение. Обновите страницу (сброс кэша).'
        boot.appendChild(err)
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

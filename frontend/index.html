<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>Dvarf</title>
    <style>
      /* Boot splash only — do NOT set color/background on html/body:
         that inherits into cards and washes out light-theme text. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: #0f1419;
        color: #e8eef5;
        font-family: system-ui, sans-serif;
      }
      #boot[hidden] { display: none; }
      #boot p { margin: 0; opacity: 0.75; font-size: 15px; }
      #boot .err { margin-top: 12px; color: #ffb4b4; font-size: 13px; max-width: 28rem; }
    </style>
  </head>
  <body>
    <div id="boot"><p>Загрузка Dvarf…</p></div>
    <div id="root"></div>
    <script>
      (function () {
        var shown = false
        function showBootError(detail) {
          var boot = document.getElementById('boot')
          if (!boot || boot.hidden || shown) return
          shown = true
          var err = document.createElement('p')
          err.className = 'err'
          err.textContent =
            'Не удалось загрузить приложение. Обновите страницу (сброс кэша).' +
            (detail ? ' (' + detail + ')' : '')
          boot.appendChild(err)
        }
        window.addEventListener('error', function (event) {
          var detail = ''
          if (event && event.filename) {
            detail = String(event.filename).split('/').pop()
          } else if (event && event.message) {
            detail = String(event.message).slice(0, 80)
          }
          showBootError(detail)
        })
        window.addEventListener('unhandledrejection', function () {
          showBootError('promise')
        })
        // If modules never arrive (VPN/MTU blackhole), leave a visible hint.
        setTimeout(function () {
          var boot = document.getElementById('boot')
          var root = document.getElementById('root')
          if (!boot || boot.hidden) return
          if (root && root.childNodes.length > 0) return
          showBootError('timeout 20s — проверьте сеть/VPN и обновите')
        }, 20000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

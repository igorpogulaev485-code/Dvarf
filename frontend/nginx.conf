# SPA document navigation has no Authorization (token is in localStorage).
# API fetch from the app sets Accept: application/json and Sec-Fetch-Dest: empty.
# Prefer Sec-Fetch-Dest=document for SPA rewrite — never rewrite XHR/fetch to index.html
# (Accept sniffing alone raced with browsers and showed «страница вместо API»).
map "$http_sec_fetch_dest:$http_authorization:$http_accept" $spa_document_nav {
    default 0;
    # Real browser document navigation (Chrome / YaBrowser / Safari / Firefox).
    ~*^document: 1;
    # Legacy / curl without Sec-Fetch: only bare HTML Accept and no Bearer → SPA.
    ~*^:text/html 1;
}

upstream dvarf_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # Auth/PATCH used to hang until the 60s default read timeout → Network «pending».
    # Fail faster so the SPA can show «временно недоступен» instead of spinning.
    proxy_connect_timeout 5s;
    proxy_send_timeout 25s;
    proxy_read_timeout 25s;

    root /usr/share/nginx/html;
    index index.html;

    # When API is down/restarting, default nginx pages are text/html and the
    # SPA shows «страница вместо API». Prefer JSON for API clients.
    error_page 502 503 504 = @api_unavailable;

    # Mobile pays hard for uncompressed JS/JSON (~1.3MB → ~330KB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /health {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Vite content-hashed bundles — cache forever after first download.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /catalog {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /characters {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /lobbies {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"detail":"Сервер временно недоступен — подождите пару секунд и повторите","code":"api_unavailable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

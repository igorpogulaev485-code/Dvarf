# SPA document navigation has no Authorization (token is in localStorage).
# API fetch from the app sets Accept: application/json and Sec-Fetch-Dest: empty.
#
# Map key: x-dvarf-client : sec-fetch-mode : sec-fetch-dest : authorization : accept
# YaBrowser / some Chromium builds omit Sec-Fetch-* on http:// — then dest/auth
# are empty and the key is `:::text/html,...`. The old pattern `^:text/html`
# never matched (one colon vs three) → raw API JSON on /characters. Fix: treat
# navigate/document OR empty-metadata HTML Accept as SPA.
# App fetch always sends X-Dvarf-Client: app — never rewrite those to index.html
# (hard-refresh races / odd Accept lists were still hitting SPA fallback).
map "$http_x_dvarf_client:$http_sec_fetch_mode:$http_sec_fetch_dest:$http_authorization:$http_accept" $spa_document_nav {
    default 0;
    # Explicit API client from the SPA — always proxy to the API.
    ~*^app: 0;
    # JSON Accept (fetch / XHR) — never treat as document navigation.
    ~*:application/json 0;
    # Real browser navigation (Chrome / YaBrowser / Safari / Firefox).
    ~*^[^:]*:navigate: 1;
    ~*^[^:]*:[^:]*:document: 1;
    # Legacy / stripped Sec-Fetch: no client, no mode, no dest, no Bearer, HTML Accept.
    ~*^::::text/html 1;
    # Same, but Accept starts with */* (rare top-level nav).
    ~*^::::\*/\* 1;
}

upstream dvarf_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # When API is down/restarting, default nginx pages are text/html and the
    # SPA shows «страница вместо API». Prefer JSON for API clients.
    error_page 502 503 504 = @api_unavailable;

    # Mobile pays hard for uncompressed JS/JSON (~1.3MB → ~330KB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /health {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Vite content-hashed bundles — cache forever after first download.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /catalog {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /characters {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /lobbies {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"detail":"Сервер временно недоступен — подождите пару секунд и повторите","code":"api_unavailable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

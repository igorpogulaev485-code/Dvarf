# Document navigation to SPA paths has no Authorization (token is in localStorage).
# API fetch always sends Bearer + Accept: application/json. Never SPA-rewrite
# authenticated API calls — Safari's Accept: text/html,*/* would otherwise get
# index.html and break JSON clients.
map "$http_authorization:$http_accept" $spa_document_nav {
    default 0;
    ~*^:text/html 1;
}

upstream dvarf_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # Mobile pays hard for uncompressed JS/JSON (~1.3MB → ~330KB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /health {
        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Vite content-hashed bundles — cache forever after first download.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Keep access_log on briefly useful for blank-screen debug; assets are hot path
        # but without logs we cannot tell if iOS failed to fetch modules.
        try_files $uri =404;
    }

    # SPA shell must never be cached across deploys — stale index.html points at
    # deleted hashed bundles → blank white #root on mobile after tip deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /catalog {
        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /characters {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lobbies {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Ensure rewritten SPA documents also skip long-lived caches.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}

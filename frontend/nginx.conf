# SPA document navigation has no Authorization (token is in localStorage).
# API fetch from the app sets Accept: application/json and Sec-Fetch-Dest: empty.
#
# Map key: x-dvarf-client : sec-fetch-mode : sec-fetch-dest : authorization : accept
# YaBrowser / some Chromium builds omit Sec-Fetch-* on http:// — then dest/auth
# are empty and the key is `:::text/html,...`. The old pattern `^:text/html`
# never matched (one colon vs three) → raw API JSON on /characters. Fix: treat
# navigate/document OR empty-metadata HTML Accept as SPA.
# App fetch always sends X-Dvarf-Client: app — never rewrite those to index.html
# (hard-refresh races / odd Accept lists were still hitting SPA fallback).
#
# CRITICAL: /characters (and friends) are dual-purpose URLs. Document navigation
# returns index.html; fetch returns JSON. Safari will cache the HTML response
# under GET /characters and reuse it for the JSON fetch unless Cache-Control
# forbids storing — that shows «Сервер вернул страницу вместо API» on mobile.
map "$http_x_dvarf_client:$http_sec_fetch_mode:$http_sec_fetch_dest:$http_authorization:$http_accept" $spa_document_nav {
    default 0;
    # Explicit API client from the SPA — always proxy to the API.
    ~*^app: 0;
    # JSON Accept (fetch / XHR) — never treat as document navigation.
    ~*:application/json 0;
    # Any Bearer token means API (token lives in localStorage; document nav has none).
    ~*:Bearer 0;
    # Real browser document navigation only (require dest=document when mode=navigate).
    ~*^[^:]*:navigate:document: 1;
    ~*^[^:]*:[^:]*:document: 1;
    # Legacy / stripped Sec-Fetch: no client, no mode, no dest, no Bearer, HTML Accept.
    ~*^::::text/html 1;
    # Same, but Accept starts with */* (rare top-level nav on http://).
    ~*^::::\*/\* 1;
}

upstream dvarf_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # Auth/PATCH used to hang until the 60s default read timeout → Network «pending».
    # Fail faster so the SPA can show «временно недоступен» instead of spinning.
    proxy_connect_timeout 5s;
    proxy_send_timeout 25s;
    proxy_read_timeout 25s;

    root /usr/share/nginx/html;
    index index.html;

    # When API is down/restarting, default nginx pages are text/html and the
    # SPA shows «страница вместо API». Prefer JSON for API clients.
    error_page 502 503 504 = @api_unavailable;

    # Mobile pays hard for uncompressed JS/JSON (~1.3MB → ~330KB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /health {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA shell: revalidate every time (no-cache), but allow store — Safari on
    # iOS sometimes paints a blank document after hard-refresh when the shell
    # is Cache-Control: no-store. Vary keeps HTML vs JSON fetches distinct for
    # dual-purpose URLs (/characters, /lobbies, …). Client also uses fetch cache
    # no-store for API calls.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept, Authorization" always;
    }

    # Vite content-hashed bundles — cache forever after first download.
    # crossorigin module/script tags need ACAO even for same-origin in Safari.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Timing-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /catalog {
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /characters {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        add_header Cache-Control "no-store" always;
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /lobbies {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        add_header Cache-Control "no-store" always;
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        add_header Cache-Control "no-store" always;
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        add_header Cache-Control "no-store" always;
        proxy_pass http://dvarf_api;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"detail":"Сервер временно недоступен — подождите пару секунд и повторите","code":"api_unavailable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

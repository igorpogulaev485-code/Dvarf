# Document navigation to SPA paths has no Authorization (token is in localStorage).
# API fetch always sends Bearer + Accept: application/json. Never SPA-rewrite
# authenticated API calls — Safari's Accept: text/html,*/* would otherwise get
# index.html and break JSON clients.
map "$http_authorization:$http_accept" $spa_document_nav {
    default 0;
    ~*^:text/html 1;
}

upstream dvarf_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /catalog {
        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /characters {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lobbies {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /settings {
        if ($spa_document_nav = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://dvarf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9DCC8"/>
      <stop offset="50%" stop-color="#EEF3EE"/>
      <stop offset="100%" stop-color="#E8D9C8"/>
    </linearGradient>
    <filter id="g" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1A241E" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg2)"/>
  <text x="40" y="46" font-family="Source Serif 4, Georgia, serif" font-size="24" font-weight="700" fill="#2F6A42">Гибрид для Dvarf: glass chrome + solid vitals</text>
  <text x="40" y="72" font-family="IBM Plex Sans, Arial" font-size="13" fill="#5C6B5F">Рекомендация: стекло для оболочки, плотные карточки для боевых цифр</text>

  <rect x="40" y="100" width="1120" height="480" rx="32" fill="rgba(255,255,255,0.40)" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" filter="url(#g)"/>

  <text x="72" y="150" font-family="Source Serif 4, Georgia, serif" font-size="28" fill="#1A241E">Keyara</text>
  <text x="72" y="178" font-family="IBM Plex Sans, Arial" font-size="14" fill="#5C6B5F">Друид 5 · полуэльф · 2014</text>

  <!-- solid vitals -->
  <rect x="72" y="220" width="150" height="120" rx="22" fill="#FFFFFF"/>
  <text x="147" y="270" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="12" fill="#5C6B5F">КД</text>
  <text x="147" y="310" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="36" font-weight="700" fill="#1A241E">16</text>

  <rect x="242" y="220" width="260" height="120" rx="22" fill="#D9EBD9"/>
  <text x="372" y="270" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="12" fill="#2F6A42">Хиты</text>
  <text x="372" y="315" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="36" font-weight="700" fill="#2F6A42">28 / 28</text>

  <rect x="522" y="220" width="150" height="120" rx="22" fill="#FFFFFF"/>
  <text x="597" y="270" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="12" fill="#5C6B5F">Иниц.</text>
  <text x="597" y="310" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="36" font-weight="700" fill="#1A241E">+2</text>

  <!-- tactile switch row -->
  <text x="72" y="400" font-family="IBM Plex Sans, Arial" font-size="13" fill="#5C6B5F">Автосейв</text>
  <rect x="160" y="380" width="72" height="38" rx="19" fill="#2F6A42"/>
  <circle cx="212" cy="399" r="15" fill="#fff"/>

  <text x="260" y="400" font-family="IBM Plex Sans, Arial" font-size="13" fill="#5C6B5F">Показывать подсказки</text>
  <rect x="430" y="380" width="72" height="38" rx="19" fill="#C5D0C5"/>
  <circle cx="450" cy="399" r="15" fill="#fff"/>

  <rect x="72" y="450" width="160" height="48" rx="24" fill="#2F6A42"/>
  <text x="152" y="480" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="15" font-weight="600" fill="#fff">Каст</text>
  <rect x="250" y="450" width="160" height="48" rx="24" fill="rgba(255,255,255,0.65)" stroke="rgba(255,255,255,0.9)"/>
  <text x="330" y="480" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="15" font-weight="600" fill="#1A241E">Отмена</text>
  <rect x="430" y="450" width="160" height="48" rx="24" fill="#C45A2C"/>
  <text x="510" y="480" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="15" font-weight="600" fill="#fff">Вдохновение</text>

  <text x="72" y="545" font-family="IBM Plex Sans, Arial" font-size="13" fill="#5C6B5F">Итог: glass shell + solid numbers + tactile controls = читаемо в бою и красиво «как Mindora/neo-skeuo рефы»</text>
</svg>
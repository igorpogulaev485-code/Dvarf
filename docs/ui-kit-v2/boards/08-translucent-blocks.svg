<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="liveBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8DFC9"/>
      <stop offset="35%" stop-color="#EEF3EE"/>
      <stop offset="70%" stop-color="#E8DCCF"/>
      <stop offset="100%" stop-color="#B7CFBA"/>

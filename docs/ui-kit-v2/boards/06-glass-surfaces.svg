<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820">
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F8F6E"/>
      <stop offset="35%" stop-color="#A8C4A6"/>
      <stop offset="70%" stop-color="#D9E6D4"/>
      <stop offset="100%" stop-color="#E8DCCF"/>
    </linearGradient>
    <!-- faux blur blobs behind glass -->
    <filter id="blob"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glassSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A241E" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#forest)"/>
  <circle cx="180" cy="200" r="120" fill="#C45A2C" opacity="0.25" filter="url(#blob)"/>
  <circle cx="900" cy="160" r="140" fill="#2F6A42" opacity="0.35" filter="url(#blob)"/>
  <circle cx="700" cy="620" r="160" fill="#FFFFFF" opacity="0.35" filter="url(#blob)"/>

  <text x="48" y="48" font-family="Source Serif 4, Georgia, serif" font-size="26" font-weight="700" fill="#14301C">Glass surfaces · можно ли?</text>
  <text x="48" y="74" font-family="IBM Plex Sans, Arial" font-size="13" fill="#2A3D30">Да — для карточек / модалок / лобби. Осторожно на плотном листе с цифрами.</text>

  <!-- glass card -->
  <rect x="60" y="120" width="420" height="280" rx="28" fill="rgba(255,255,255,0.42)" stroke="rgba(255,255,255,0.72)" stroke-width="1.5" filter="url(#glassSh)"/>
  <text x="88" y="170" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#1A241E">Карточка персонажа</text>
  <text x="88" y="200" font-family="IBM Plex Sans, Arial" font-size="14" fill="#5C6B5F">Друид · 5 ур. · стекло поверх фона</text>
  <rect x="88" y="230" width="120" height="40" rx="14" fill="#2F6A42"/>
  <text x="148" y="255" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="14" fill="#fff">Открыть</text>
  <rect x="224" y="230" width="140" height="40" rx="14" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.8)"/>
  <text x="294" y="255" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="14" fill="#1A241E">В лобби</text>
  <text x="88" y="320" font-family="IBM Plex Sans, Arial" font-size="12" fill="#5C6B5F">opacity ~40–55% + blur + thin light border</text>

  <!-- glass modal -->
  <rect x="520" y="120" width="520" height="280" rx="28" fill="rgba(255,255,255,0.50)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" filter="url(#glassSh)"/>
  <text x="560" y="175" font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#1A241E">Модалка / всплывашка</text>
  <text x="560" y="210" font-family="IBM Plex Sans, Arial" font-size="14" fill="#5C6B5F">Кастовать «Огненный шар»?</text>
  <rect x="560" y="250" width="140" height="48" rx="16" fill="#2F6A42"/>
  <text x="630" y="280" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="15" font-weight="600" fill="#fff">Каст</text>
  <rect x="720" y="250" width="140" height="48" rx="16" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.85)"/>
  <text x="790" y="280" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="15" font-weight="600" fill="#1A241E">Отмена</text>
  <text x="560" y="345" font-family="IBM Plex Sans, Arial" font-size="12" fill="#5C6B5F">Лучшее место для glass: dialogs, pads, sheets</text>

  <!-- DO / DONT -->
  <rect x="60" y="440" width="480" height="320" rx="28" fill="rgba(255,255,255,0.48)" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" filter="url(#glassSh)"/>
  <text x="90" y="490" font-family="Source Serif 4, Georgia, serif" font-size="20" fill="#2F6A42">Где СТЕКЛО — да</text>
  <text x="90" y="530" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• модалки каста / отдыха / подтверждения</text>
  <text x="90" y="560" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• карточки списка персонажей / лобби</text>
  <text x="90" y="590" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• нижние sheets на телефоне</text>
  <text x="90" y="620" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• кабинет «Оформление»</text>
  <text x="90" y="670" font-family="IBM Plex Sans, Arial" font-size="13" fill="#5C6B5F">Фон за стеклом должен быть живым (градиент/мягкое фото природы), иначе эффект «грязное молоко».</text>

  <rect x="560" y="440" width="480" height="320" rx="28" fill="rgba(255,255,255,0.48)" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" filter="url(#glassSh)"/>
  <text x="590" y="490" font-family="Source Serif 4, Georgia, serif" font-size="20" fill="#B42318">Где СТЕКЛО — осторожно / нет</text>
  <text x="590" y="530" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• плотная таблица слотов заклинаний</text>
  <text x="590" y="560" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• гримуар с длинным списком</text>
  <text x="590" y="590" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• classic print / PDF</text>
  <text x="590" y="620" font-family="IBM Plex Sans, Arial" font-size="15" fill="#1A241E">• мелкий текст на слабом контрасте</text>
  <text x="590" y="670" font-family="IBM Plex Sans, Arial" font-size="13" fill="#5C6B5F">Для цифр HP/КД лучше solid soft-card (как health apps), стекло — рамка вокруг.</text>
</svg>
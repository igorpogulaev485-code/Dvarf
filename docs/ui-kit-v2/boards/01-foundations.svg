  <rect x="830" y="555" width="170" height="52" rx="16" fill="#2F6A42"/>
  <text x="915" y="587" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="15" font-weight="600" fill="#fff">Отдых</text>

  <text x="796" y="381" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="12" fill="#fff">XP +50</text>

  <!-- vitals -->
  <rect x="48" y="460" width="992" height="210" rx="24" fill="#FFFFFF" filter="url(#s)"/>
  <text x="72" y="500" font-family="Source Serif 4, Georgia, serif" font-size="18" fill="#1A241E">Vitals (как health-apps: крупные цифры)</text>

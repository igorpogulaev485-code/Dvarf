  <text x="142" y="575" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="12" fill="#5C6B5F">КД</text>
  <text x="142" y="605" text-anchor="middle" font-family="IBM Plex Sans, Arial" font-size="28" font-weight="700" fill="#1A241E">16</text>

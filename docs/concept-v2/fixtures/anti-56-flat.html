<!DOCTYPE html>
<html lang="ru" data-theme="light-designer3" data-bg="parchment" data-v2 data-width="desktop">
<head>
  <meta charset="utf-8" />
  <title>Антиэталон: кубик 56×56 и плоский фон</title>
  <style>
    /* Числа с css/mobile-chars-nav.css .fab-dice. Этот файл в кит не подключается. */
    html, body, .sidebar, .legal {
      background-color: #f7f2e4;
      background-image: none;
    }
    body { margin: 0; min-height: 100vh; }
    .sidebar { width: 240px; min-height: 100vh; }
    .card {
      background-color: #fffdf8;
      background-image: none;
      margin: 32px 280px;
      padding: 16px;
    }
    html[data-v2] .fab-dice {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(78, 93, 52, 0.4);
      background: rgba(78, 93, 52, 0.15);
      color: #4e5d34;
      box-sizing: border-box;
    }
    html[data-v2] .fab-dice svg { width: 28px; height: 28px; display: block; }
  </style>
</head>
<body>
  <aside class="sidebar"></aside>
  <main class="card">Плоский холст</main>
  <footer class="legal"></footer>
  <button class="fab-dice" type="button" aria-label="к20">
    <svg class="ui-dice-fab__icon" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <path fill="currentColor" d="M16 2.2 28.5 9v14L16 29.8 3.5 23V9L16 2.2zm0 2.5L6.2 10.1v11.8L16 27.3l9.8-5.4V10.1L16 4.7z"/>
      <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
      <circle cx="11.2" cy="12.2" r="1.4" fill="currentColor"/>
      <circle cx="20.8" cy="12.2" r="1.4" fill="currentColor"/>
      <circle cx="11.2" cy="19.8" r="1.4" fill="currentColor"/>
      <circle cx="20.8" cy="19.8" r="1.4" fill="currentColor"/>
    </svg>
  </button>
</body>
</html>

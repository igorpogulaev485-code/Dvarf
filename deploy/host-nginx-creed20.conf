# Host nginx in front of dvarf-web (Docker binds 127.0.0.1:8080).
# Pair with /etc/nginx/conf.d/dvarf-upgrade-map.conf (see setup-https.sh).
# After certbot: SSL listen blocks are added here automatically.

upstream dvarf_web_local {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name creed20.tech www.creed20.tech 201.34.132.252 _;

    client_max_body_size 8m;

    location / {
        proxy_pass http://dvarf_web_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

services:
  db:
    image: postgres:16-alpine
    container_name: dvarf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dvarf
      POSTGRES_USER: dvarf
      POSTGRES_PASSWORD: dvarf
    ports:
      - "5432:5432"
    volumes:
      - dvarf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvarf -d dvarf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dvarf_pg_data:
